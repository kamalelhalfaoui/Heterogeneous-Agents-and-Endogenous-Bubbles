[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bh1998"
version = "1.0.0"
description = "Heterogeneous agents, evolutionary selection and endogenous bubbles in an asset pricing model"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kamal El Halfaoui" }]
keywords = ["agent-based", "asset pricing", "heterogeneous agents", "nonlinear dynamics", "chaos", "computational economics"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
